name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      live_quotes:
        description: Run live aggregator quote tests (external APIs)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit, fuzz and invariant tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - name: Run offline suite
        run: forge test --no-match-path 'test/**/*Fork.t.sol' -vv

  fork:
    name: Fork tests (${{ matrix.network }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: Ethereum
            contract: GenericOpenFillForkTest
          - network: Katana
            contract: AvKatBuybackForkTest
    env:
      RUN_FORK_TESTS: 'true'
      RUN_KATANA_FORK_TESTS: 'true'
      RUN_LIVE_QUOTES: 'false'
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      KATANA_RPC_URL: ${{ secrets.KATANA_RPC_URL || 'https://rpc.katana.network' }}
      # Public Ethereum RPC serves recent state; archive access needs a provider key.
      FORK_BLOCK: '0'
      KATANA_FORK_BLOCK: '47557066'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
          cache-key: fork-${{ matrix.network }}-${{ github.sha }}
          cache-restore-keys: fork-${{ matrix.network }}-
      - name: Run fork suite
        run: forge test --match-contract '${{ matrix.contract }}' --no-match-test 'test_Fork_.*LiveQuote' -vv

  live-quotes:
    name: Live aggregator quotes
    if: github.event_name == 'workflow_dispatch' && inputs.live_quotes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_FORK_TESTS: 'true'
      RUN_LIVE_QUOTES: 'true'
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      ZERO_EX_API_KEY: ${{ secrets.ZERO_EX_API_KEY }}
      ONEINCH_API_KEY: ${{ secrets.ONEINCH_API_KEY }}
      FORK_BLOCK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - name: Report optional quote credentials
        run: |
          if [[ -z "$ZERO_EX_API_KEY" ]]; then
            echo '::notice::ZERO_EX_API_KEY is unset; the 0x test will skip.'
          fi
          if [[ -z "$ONEINCH_API_KEY" ]]; then
            echo '::notice::ONEINCH_API_KEY is unset; the 1inch test will skip.'
          fi
      - name: Run live quote suite at the latest block
        run: forge test --match-contract GenericOpenFillForkTest --match-test 'test_Fork_.*LiveQuote' --ffi -vv
