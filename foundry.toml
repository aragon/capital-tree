[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./metadata" }, { access = "read", path = "./config" }]

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[lint]
lint_on_build = false
