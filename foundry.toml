[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./metadata" }, { access = "read", path = "./config" }]

[invariant]
runs = 64
depth = 32
fail_on_revert = true

# Deeper campaigns for CI: `FOUNDRY_PROFILE=ci forge test`
[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 1024
depth = 128

[lint]
lint_on_build = false

# `forge test --mutate <file>`: per-mutant wall-clock limit in seconds
[mutation]
timeout = 60

# `forge test --symbolic`: runs `check*`/`prove*` tests; needs the z3 binary
[profile.default.symbolic]
solver = "z3"
timeout = 30
